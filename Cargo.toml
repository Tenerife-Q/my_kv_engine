[package]
name = "my_kv_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40.0", features = ["full"] } # 建议更新到较新稳定版
# --- 新增网络与字节流处理依赖 ---
bytes = "1.5"
# 注意：必须手动开启 codec feature，否则找不到 Decoder trait
tokio-util = { version = "0.7.10", features = ["codec"] }
futures = "0.3"
tokio-stream = "0.1"

# 保留原有的 server/client
[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

# --- 新增 V2 版本的可执行文件，用于本次重构 ---
[[bin]]
name = "server_v2"
path = "src/bin/server_v2.rs"

[[bin]]
name = "client_v2"
path = "src/bin/client_v2.rs"