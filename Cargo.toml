[package]
name = "my_kv_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["full"] }

[[bin]]
name = "server"
path = "src/bin/server.rs" # 或者你目前的路径

[[bin]]
name = "client"
path = "src/bin/client.rs"